# Local bridge between bots (used by GO-4 to run other bots' commands)
bridge:
  blocked_cogs:
    - 'Manage'
    - 'Developer Control'
    - 'General'
  blocked_commands:
    - 'login_instagram'
    - 'logout_instagram'
